<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050705">
  <title>Battle Arena</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#050705;color:white;font-family:Arial,sans-serif;padding-bottom:85px}
    header{padding:22px 18px;border-bottom:1px solid #302700;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .logo{font-size:25px;font-weight:900;color:#ffc928}
    .coins{border:1px solid #ffc928;padding:10px;border-radius:10px;white-space:nowrap}
    .banner{margin:16px;padding:22px;border-radius:16px;background:linear-gradient(130deg,#302400,#101410);border:1px solid #755d00}
    .banner h1{font-size:28px;margin:5px 0}
    .gold{color:#ffc928}
    .tabs{display:flex;gap:8px;padding:0 12px}
    button{cursor:pointer;font-weight:bold;border-radius:10px;border:1px solid #544500;background:#151713;color:white;padding:12px}
    .tabs button{flex:1}
    button.active,.primary{background:#ffc928;color:#080808}
    h2{padding:0 16px;margin-top:28px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
    .card{background:#10130f;border:1px solid #393000;border-radius:13px;padding:14px;min-width:0}
    .card h3{font-size:17px;overflow-wrap:anywhere}
    .muted{color:#a9adb7;font-size:14px;line-height:1.6}
    .prize{color:#ffc928;font-size:21px;font-weight:bold}
    .card button{width:100%;margin-top:12px}
    #notice{margin:15px;padding:12px;border-radius:8px;background:#17251a;color:#a8f5bc;display:none;overflow-wrap:anywhere}
    nav{position:fixed;bottom:0;left:0;right:0;background:#000;display:flex;justify-content:space-around;padding:13px 2px;border-top:1px solid #292929}
    nav button{border:0;background:transparent;padding:7px 3px;font-size:12px;color:#a8adb8}
    nav button.active{color:#ffc928;background:transparent}
    @media(max-width:520px){.grid{grid-template-columns:1fr}.logo{font-size:21px}}
  </style>
</head>
<body>
<header>
  <div class="logo">⚡ BATTLE ARENA</div>
  <div class="coins">🪙 <span id="coins">100</span></div>
</header>

<section class="banner">
  <p class="gold">YOUR NEXT MATCH STARTS HERE</p>
  <h1>PLAY. COMPETE.<br><span class="gold">RISE UP.</span></h1>
  <p class="muted">Join tournaments and track your progress.</p>
</section>

<div class="tabs">
  <button class="active" onclick="showMatches('Upcoming',this)">Upcoming</button>
  <button onclick="showMatches('Ongoing',this)">Ongoing</button>
  <button onclick="showMatches('Completed',this)">Completed</button>
</div>

<h2 id="heading">Upcoming Tournaments</h2>
<div id="notice" role="status"></div>
<div class="grid" id="matches"></div>

<nav>
  <button class="active" onclick="page('Home',this)">⌂<br>Home</button>
  <button onclick="page('Wallet',this)">▣<br>Wallet</button>
  <button onclick="page('Leaderboard',this)">🏆<br>Ranks</button>
  <button onclick="page('Rewards',this)">🎁<br>Rewards</button>
  <button onclick="page('Profile',this)">●<br>Profile</button>
</nav>

<script>
/* Paste your Supabase project URL and publishable key below. */
const SUPABASE_URL = "https://jiyhcuzaixgbhhlsdqav.supabase.co";
const SUPABASE_KEY = "sb_publishable_RvG39Gcn-9GETyR9EiOR7Q_cEWoyM8d";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let allTournaments = [];
let currentStatus = "Upcoming";

function showNotice(message) {
  const notice = document.getElementById("notice");
  notice.style.display = "block";
  notice.textContent = message;
}

function hideNotice() {
  const notice = document.getElementById("notice");
  notice.style.display = "none";
  notice.textContent = "";
}

function normalizeStatus(status) {
  const s = String(status || "").trim().toLowerCase();
  if (s === "upcoming") return "Upcoming";
  if (s === "ongoing" || s === "live") return "Ongoing";
  if (s === "completed" || s === "finished") return "Completed";
  return String(status || "Upcoming");
}

async function loadTournaments() {
  const matches = document.getElementById("matches");
  matches.textContent = "Loading tournaments…";

  const { data, error } = await supabaseClient
    .from("tournaments")
    .select("id,title,game_mode,map_name,status,prize_pool,entry_fee,match_time,created_at")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Supabase error:", error);
    matches.replaceChildren();
    showNotice("Tournaments load nahi hue. Supabase URL, publishable key, column names aur SELECT RLS policy check karein. Error: " + error.message);
    return;
  }

  allTournaments = data || [];
  hideNotice();
  renderTournaments(currentStatus);
}

function renderTournaments(status) {
  const matches = document.getElementById("matches");
  const heading = document.getElementById("heading");
  heading.textContent = status + " Tournaments";
  matches.replaceChildren();

  const filtered = allTournaments.filter(t => normalizeStatus(t.status) === status);

  if (filtered.length === 0) {
    const empty = document.createElement("p");
    empty.className = "muted";
    empty.textContent = "No " + status.toLowerCase() + " tournaments found.";
    matches.appendChild(empty);
    return;
  }

  filtered.forEach(t => {
    const card = document.createElement("article");
    card.className = "card";

    const mode = document.createElement("p");
    mode.className = "gold";
    mode.textContent = t.game_mode || "Game mode not set";

    const title = document.createElement("h3");
    title.textContent = t.title || "Untitled tournament";

    const info = document.createElement("p");
    info.className = "muted";
    const map = t.map_name || "Map not set";
    info.textContent = map + " • " + normalizeStatus(t.status);

    const time = document.createElement("p");
    time.className = "muted";
    if (t.match_time) {
      const date = new Date(t.match_time);
      time.textContent = "Match time: " + (Number.isNaN(date.getTime()) ? t.match_time : date.toLocaleString());
    } else {
      time.textContent = "Match time not set";
    }

    const prize = document.createElement("p");
    prize.className = "prize";
    prize.textContent = "🪙 Prize: ₹" + Number(t.prize_pool || 0).toLocaleString("en-IN");

    const entry = document.createElement("p");
    entry.className = "muted";
    entry.textContent = "Entry fee: ₹" + Number(t.entry_fee || 0).toLocaleString("en-IN");

    const btn = document.createElement("button");
    btn.className = "primary";
    btn.textContent = "View Match";
    btn.addEventListener("click", () => {
      showNotice((t.title || "Tournament") + " selected. Registration is not connected yet.");
    });

    card.append(mode, title, info, time, prize, entry, btn);
    matches.appendChild(card);
  });
}

function showMatches(status, btn) {
  currentStatus = status;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
  renderTournaments(status);
}

function page(name, btn) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");

  if (name === "Home") {
    const upcomingBtn = document.querySelector(".tabs button");
    showMatches("Upcoming", upcomingBtn);
    return;
  }

  document.getElementById("heading").textContent = name;
  const matches = document.getElementById("matches");
  matches.replaceChildren();

  const card = document.createElement("div");
  card.className = "card";
  const title = document.createElement("h3");
  title.textContent = name;
  const description = document.createElement("p");
  description.className = "muted";

  const messages = {
    Wallet: "Demo coins: " + document.getElementById("coins").textContent,
    Leaderboard: "Rankings will appear here.",
    Rewards: "Demo rewards coming soon.",
    Profile: "Player profile coming soon."
  };
  description.textContent = messages[name] || "";
  card.append(title, description);
  matches.appendChild(card);
  hideNotice();
}

loadTournaments();
</script>
</body>
</html>
